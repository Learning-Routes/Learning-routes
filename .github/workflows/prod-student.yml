name: Production student check

# STEP 11-prep §A3: a fixed fictional student enrolls in a free module on production, answers topic
# 1's check, and is offered the next topic. Started by hand, and after every web deploy from main
# (deploys run from the owner's machine, which starts it). Its sign-in link comes from the proof
# inbox's KV, with a token that can only read Workers KV.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-student
  cancel-in-progress: false

jobs:
  student:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @learning-routes/web prod:student
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROOF_INBOX_KV_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Screenshots at 1440 and 390, and each step's time: never a sign-in link.
      - name: Keep the report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: prod-student
          path: apps/web/prod-report
          retention-days: 14
