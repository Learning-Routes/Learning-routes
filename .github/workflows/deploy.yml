name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy with Kamal
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      DOCKER_BUILDKIT: 1
      KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      # Must hold the contents of config/credentials/production.key — this app uses
      # per-environment credentials, so production.yml.enc is what gets decrypted.
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      # The env var MUST be named POSTGRES_PASSWORD: that is what database.yml:59
      # and .kamal/secrets read. It was previously exported as
      # LEARNING_ROUTES_DATABASE_PASSWORD, a name nothing in the repo reads, so the
      # Postgres password was always empty on an Actions deploy. The GitHub secret
      # keeps its existing name; only the exported variable is corrected.
      POSTGRES_PASSWORD: ${{ secrets.LEARNING_ROUTES_DATABASE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy with Kamal
        run: bundle exec kamal deploy
