name: Deploy to Production

# STEP 38 §6, the owner's ruling: the automatic deploy is off. A merge used to
# start this after CI and produce a red run; now it runs only when started from
# the Actions tab. The job's steps are unchanged for the day the trigger comes
# back; only its `if` on the CI run's result went, since a manual run has none.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy with Kamal
    # Pinned: setup-ruby has no Ruby 3.3.8 build for a newer ubuntu-latest.
    runs-on: ubuntu-24.04

    env:
      DOCKER_BUILDKIT: 1
      KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      # Must hold the contents of config/credentials/production.key — this app uses
      # per-environment credentials, so production.yml.enc is what gets decrypted.
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      # The env var MUST be named POSTGRES_PASSWORD: that is what database.yml:59
      # and .kamal/secrets read. It was previously exported as
      # LEARNING_ROUTES_DATABASE_PASSWORD, a name nothing in the repo reads, so the
      # Postgres password was always empty on an Actions deploy. The GitHub secret
      # keeps its existing name; only the exported variable is corrected.
      POSTGRES_PASSWORD: ${{ secrets.LEARNING_ROUTES_DATABASE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy with Kamal
        run: bundle exec kamal deploy
