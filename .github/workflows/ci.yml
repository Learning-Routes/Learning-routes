name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    # Pinned: libvips42t64 below is the Ubuntu 24.04 package name.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # bin/importmap boots the app (config/application.rb), so it needs libvips too.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips42t64

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    # Pinned: libvips42t64 below is the Ubuntu 24.04 package name.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

    steps:
      - name: Install packages
        # libvips42t64 is the runtime the Dockerfile's `libvips` provides: ruby-vips is
        # in the Gemfile, so Bundler.require (config/application.rb) loads libvips.so.42
        # at boot. Without it every job that boots Rails died before running anything.
        # Ubuntu 24.04 has no plain `libvips` package; this is its name there.
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips42t64

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # app/assets/builds is gitignored, so a fresh checkout has no tailwind.css and
      # every page render raises. tailwindcss-rails builds it from `test:prepare`, but
      # Rails runs that only from the `test` COMMAND, not from these rake tasks
      # (railties test_command.rb#perform), so CI never built it.
      # test/javascript/*_test.rb shell out to node. motion_cues_test needs >= 23.6
      # (TypeScript type stripping) and SKIPS below it, so an unpinned runner node
      # would turn those tests into silent passes.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Run tests
        run: bin/rails db:test:prepare test

      # The engines are a SEPARATE step, and the glob is the whole point: `bin/rails
      # test` only collects `test/`, so until now the 57 test files under `engines/`
      # never ran in CI — and CI green auto-deploys (deploy.yml). Three strict-loading
      # violations in the route-generation, gap-analysis and reinforcement jobs sat
      # behind that gap: a WARN line each in production, where the setting is :log,
      # but hard failures under the suite's :raise.
      #
      # NOT folded into the line above as `bin/rails test test engines/*/test`:
      # naming `test` explicitly makes the runner collect `test/system` too (measured
      # — Capybara boots Puma), which is the `system-test` job's work and needs a
      # browser this job does not have. The bare form excludes system tests; this
      # form adds only the engines.
      #
      # `engines/*/test` and not a hardcoded list, so a new engine is covered the day
      # it gets its first test. community_engine has no test directory yet and the
      # glob simply does not match it.
      - name: Run engine tests
        run: bin/rails test engines/*/test

  system-test:
    # Pinned: libvips42t64 below is the Ubuntu 24.04 package name.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

    steps:
      - name: Install packages
        # libvips42t64 is the runtime the Dockerfile's `libvips` provides: ruby-vips is
        # in the Gemfile, so Bundler.require (config/application.rb) loads libvips.so.42
        # at boot. Without it every job that boots Rails died before running anything.
        # Ubuntu 24.04 has no plain `libvips` package; this is its name there.
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips42t64

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # app/assets/builds is gitignored, so a fresh checkout has no tailwind.css and
      # every page render raises. tailwindcss-rails builds it from `test:prepare`, but
      # Rails runs that only from the `test` COMMAND, not from these rake tasks
      # (railties test_command.rb#perform), so CI never built it.
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Run System Tests
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
