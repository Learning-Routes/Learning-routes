name: Workflow rules

# The public-repository rules for workflows (platform/docs/WORKING_AGREEMENT.md),
# and the license every package declares, checked on every pull request whatever
# it touches.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's own Ruby: the check needs nothing else.
      - run: ruby .github/scripts/check-workflows.rb
      # Every package.json declares the repository's license (LICENSE.md).
      - run: ruby .github/scripts/check-licenses.rb
