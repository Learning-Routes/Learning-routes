name: Platform

# The platform (STEP 46 §1): install, typecheck, lint, test and build.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    # The same image as docker-compose.yml (Platform STEP 2 §1.2). LOCAL
    # ONLY: the password is the fixed development value, used nowhere else.
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-only-superuser
          POSTGRES_DB: learning_routes
        ports:
          - 54318:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learning_routes"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The role script compose runs on first start; a service container cannot
      # mount it, so it runs here, with the image's own psql.
      - name: Create the database roles
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d learning_routes < db/init/01-roles.sql
      - run: pnpm install --frozen-lockfile
      # The visual tests' one fixed browser build, tied to the pinned @playwright/test.
      - name: Install the visual tests' browser
        run: pnpm --filter @learning-routes/web exec playwright install --with-deps chromium firefox webkit
      # Every check a contributor runs, in the same command (Platform STEP 1 §4.6):
      # types, lint, boundaries, knip, sizes, shortcuts, names, fixtures, versions,
      # tests with coverage, builds, budgets and the browser tests in the
      # runner's installed Chrome. Each runs even when one before it failed.
      - run: pnpm check
        env:
          # On main the journey is recorded at 1440 and 390 for the reviewer (STEP 11-prep §A2).
          JOURNEY_VIDEO: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
      # Baselines are recorded here, not on a laptop: a run with a missing or changed
      # screenshot writes it, and this keeps it to download and commit.
      - name: Keep the visual results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: visual-results
          path: |
            apps/web/e2e/visual-baselines
            apps/web/test-results
          if-no-files-found: ignore
      - name: Keep the journey's videos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          name: journey-videos
          path: apps/web/test-results/journey-*/**/*.webm
          if-no-files-found: warn
      # Not gating yet (STEP 46 §2.8): prints each hot function against its
      # baseline; a regression over 30% goes in the pull request description.
      - name: Benchmarks against the baseline
        run: pnpm bench
        continue-on-error: true
        if: ${{ !cancelled() }}
