name: Platform

# The new platform in platform/ (STEP 46 §1): install, typecheck, lint, test and
# build. Skipped, not left out, when platform/ did not change, because branch
# protection requires the platform job and a check that never reports blocks a PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts this change touches (.github/scripts/changed-parts.sh). The jobs
  # below are skipped when platform/ did not change; Rails runs in ci.yml.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rails: ${{ steps.parts.outputs.rails }}
      platform: ${{ steps.parts.outputs.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: List the parts that changed
        id: parts
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE...$HEAD"
          fi | .github/scripts/changed-parts.sh | tee -a "$GITHUB_OUTPUT"

  platform:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from packageManager in platform/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: platform/.nvmrc
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Every check below runs even when one before it failed, so one run shows
      # every guardrail that broke.
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: pnpm build
        id: build
        if: ${{ !cancelled() }}
      - name: JavaScript budgets (size-limit)
        run: pnpm --filter @learning-routes/web size
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Worker size budgets
        run: pnpm worker-size
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      # Browser tests against the built Worker, in the runner's installed Chrome.
      - run: pnpm --filter @learning-routes/web e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: The architecture holds (dependency-cruiser)
        run: pnpm deps
        if: ${{ !cancelled() }}
      - name: No unused files, exports or dependencies (knip)
        run: pnpm knip
        if: ${{ !cancelled() }}
      # Not gating yet (STEP 46 §2.8): prints each hot function against its
      # baseline; a regression over 30% goes in the pull request description.
      - name: Benchmarks against the baseline
        run: pnpm bench
        continue-on-error: true
        if: ${{ !cancelled() }}
      - name: Versions are exact and at least 14 days old
        run: node scripts/check-versions.mjs
        if: ${{ !cancelled() }}
