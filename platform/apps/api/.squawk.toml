# squawk lints every migration (Platform STEP 2 §1.5). pnpm db:migrate runs each
# file in one transaction unless its first line is "-- no-transaction", so squawk
# assumes a transaction too; that is what lets an index on a table created in the
# same file pass require-concurrent-index-creation.
pg_version = "18.0"
assume_in_transaction = true

# pnpm db:migrate sets lock_timeout and statement_timeout before every file
# (scripts/migrate.ts; a test checks it), so a file need not set them itself.
excluded_rules = ["require-lock-timeout", "require-statement-timeout"]
