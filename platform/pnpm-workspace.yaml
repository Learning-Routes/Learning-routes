packages:
  - apps/*
  - packages/*

# Install only versions published at least 14 days ago. The unit is minutes
# (20160 = 14 × 24 × 60); the setting exists since pnpm 10.16.0 (we pin 10.33.0).
minimumReleaseAge: 20160

# pnpm 10.33 resolves vitest's vite peer from the "latest" tag and then
# refuses it under minimumReleaseAge instead of taking an older release. Keep this
# equal to apps/web's vite; drop it once pnpm picks a mature version for peers.
overrides:
  # drizzle-kit's TypeScript loader (@esbuild-kit) asks for esbuild ~0.18, three
  # years old. It uses only esbuild's transform API, which 0.28 keeps; held at
  # the newest release at least 14 days old, like the rest of the workspace.
  "@esbuild-kit/core-utils>esbuild": 0.28.2
  vite: 8.3.4
  # magicast (under @vitest/coverage-v8) asks for ^7 Babel, and pnpm 10.33 takes
  # the newest release and then refuses it under minimumReleaseAge. Held at the
  # newest 7.x at least 14 days old; drop these when pnpm picks a mature release.
  "@babel/parser": 7.29.9
  "@babel/types": 7.29.8
  "@babel/helper-string-parser": 7.29.7
  # Security fix: miniflare (behind wrangler and the Vite plugin) pins undici
  # 7.29.1, which has eight advisories fixed in 7.30.1. Drop this once miniflare
  # ships a fixed undici.
  undici: 7.30.1

# Security fixes are not delayed (STEP 46 §2.6): this one version was 13 days old
# when taken. Remove the entry with the undici override above.
minimumReleaseAgeExclude:
  - undici@7.30.1
