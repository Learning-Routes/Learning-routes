<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catálogo de rutas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F2F6;font-family:"Archivo",system-ui,sans-serif;color:#1D1226}
a{color:#57248A}a:hover{color:#3E1866}
</style>
</helmet>
<div style="min-height: 100vh; background: #F5F2F6; font-family: Archivo, system-ui, sans-serif; color: #1D1226; font-variant-numeric: tabular-nums">
<header style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 20px 40px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1D1226">
<svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#1D1226"></rect><path d="M7 20 C 12 20, 12 9, 21 8" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round"></path><circle cx="21" cy="8" r="2.8" fill="#E79A0F"></circle></svg>
<span style="font-weight: 800; font-size: 18px; font-stretch: 110%">Learning Routes</span>
</a>
<nav style="display: flex; align-items: center; gap: 28px; flex-wrap: wrap; font-size: 16px">
<a href="Catalogo.dc.html" aria-current="page" style="color: #1D1226; text-decoration: none; font-weight: 700; border-bottom: 3px solid #6A2EA0; padding-bottom: 4px">Explorar rutas</a>
<a href="Ensenar.dc.html" style="color: #1D1226; text-decoration: none">Enseñar</a>
<a href="MisRutas.dc.html" style="color: #1D1226; text-decoration: none">Mis rutas</a>
</nav>
</header>

<main style="max-width: 1360px; margin: 0 auto; padding: 32px 40px 96px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-size: clamp(48px, 6vw, 92px); font-weight: 800; font-stretch: 118%; letter-spacing: -0.045em; line-height: 0.92">¿Qué quieres aprender?</h1>

<form role="search" style="display: flex; gap: 12px; flex-wrap: wrap; max-width: 880px">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar rutas</label>
<input id="q" type="search" placeholder="Inglés, cálculo, guitarra…" style="flex: 1 1 420px; min-width: 0; height: 60px; box-sizing: border-box; border: 2px solid #1D1226; border-radius: 14px; background: #FFFFFF; padding: 0 20px; font-family: Archivo, sans-serif; font-size: 19px; color: #1D1226">
<button style="height: 60px; padding: 0 26px; border-radius: 14px; border: none; background: #6A2EA0; color: #FFFFFF; font-family: Archivo, sans-serif; font-weight: 700; font-size: 18px; box-shadow: 0 4px 0 0 #42185F">Buscar</button>
</form>

<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center" role="group" aria-label="Filtrar por tema">
<button aria-pressed="true" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: none; background: #1D1226; color: #FFFFFF; font-family: Archivo, sans-serif; font-size: 16px; font-weight: 600">Todo</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1.5px solid #C9BBD3; background: transparent; color: #1D1226; font-family: Archivo, sans-serif; font-size: 16px">Idiomas</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1.5px solid #C9BBD3; background: transparent; color: #1D1226; font-family: Archivo, sans-serif; font-size: 16px">Matemáticas</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1.5px solid #C9BBD3; background: transparent; color: #1D1226; font-family: Archivo, sans-serif; font-size: 16px">Programación</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1.5px solid #C9BBD3; background: transparent; color: #1D1226; font-family: Archivo, sans-serif; font-size: 16px">Música</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1.5px solid #C9BBD3; background: transparent; color: #1D1226; font-family: Archivo, sans-serif; font-size: 16px">Negocios</button>
<span style="margin-left: auto; font-size: 15px; color: #4A3D54">Todas empiezan con un módulo gratis</span>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px">
<sc-for list="{{routes}}" as="r" hint-placeholder-count="6">
<a href="Ruta.dc.html" style="text-decoration: none; color: #1D1226; background: #FFFFFF; border-radius: 22px; padding: 26px; display: flex; flex-direction: column; gap: 16px; box-shadow: inset 0 0 0 1px #E4DCE8">
<svg viewBox="0 0 320 100" style="width: 100%; height: auto; display: block" aria-hidden="true">
<path d="{{r.path}}" stroke="#ECE6EF" stroke-width="16" fill="none" stroke-linecap="round"></path>
<path d="{{r.path}}" stroke="{{r.color}}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 9"></path>
<circle cx="{{r.sx}}" cy="{{r.sy}}" r="9" fill="{{r.color}}"></circle>
<rect x="{{r.ex}}" y="{{r.ey}}" width="18" height="18" rx="3" fill="#1D1226"></rect>
</svg>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1">{{r.title}}</h2>
<p style="margin: 0; font-size: 16px; color: #4A3D54">Con {{r.creator}}</p>
</div>
<p style="margin: 0; font-size: 15px; color: #4A3D54; border-top: 1px solid #ECE6EF; padding-top: 14px">{{r.modules}} módulos y {{r.topics}} temas, en {{r.lang}}</p>
</a>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>

return {

{ title: 'Cálculo sin miedo', creator: 'Profe Tomás', modules: 6, topics: 41, lang: 'español', color: '#2C5F8E', path: 'M14 24 C 50 24, 44 80, 96 80 S 140 22, 184 26 S 236 84, 268 72 S 300 44, 306 46', sx: 14, sy: 24, ex: 297, ey: 37 },

{ title: 'Tu primera app web', creator: 'Diego Ramos', modules: 5, topics: 30, lang: 'español', color: '#1D1226', path: 'M14 84 L 80 84 C 110 84, 110 50, 140 50 L 200 50 C 230 50, 230 18, 260 18 L 306 18', sx: 14, sy: 84, ex: 297, ey: 9 },
{ title: 'Guitarra desde cero', creator: 'Andrés Mora', modules: 4, topics: 18, lang: 'español', color: '#127C76', path: 'M14 50 C 40 12, 80 12, 110 50 S 180 88, 210 50 S 270 12, 306 34', sx: 14, sy: 50, ex: 297, ey: 25 },
{ title: 'Finanzas para tu negocio', creator: 'Paula Rojas', modules: 3, topics: 15, lang: 'español', color: '#2E6B4B', path: 'M14 78 C 90 78, 110 60, 160 44 S 250 20, 306 22', sx: 14, sy: 78, ex: 297, ey: 13 }
]
};
}
}
</script>
</body>
</html>
